name: live_tv
description: "LVS Live TV Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.3.0
  wakelock_plus: ^1.4.0
  cached_network_image: ^3.4.1
  http: ^1.6.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  media_kit_libs_linux: any
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  shimmer: ^3.0.0
  google_mobile_ads: ^5.1.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.4
  flutter_native_splash: ^2.4.3  # runtime: preserve() / remove()
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.3  # codegen: dart run flutter_native_splash:create

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_native_splash:
  color: "#0f0f13"           # matches app background
  image: assets/icon.png
  color_dark: "#0f0f13"
  image_dark: assets/icon.png
  android: true
  ios: false                 # Android TV only
  android_gravity: center
  fullscreen: true

